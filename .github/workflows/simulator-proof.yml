name: simulator proof
on:
  push:
    branches: [codex/metadrive-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driving:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      DEV: CPU:LLVM
      SIMULATION_ONNX: '1'
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '2'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: lfs.fetchexclude
      GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_supercombo.onnx
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Headless graphics dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri
        python - <<'PY'
        import statistics
        import time
        from panda3d.core import loadPrcFileData
        loadPrcFileData('', 'load-display p3headlessgl\naudio-library-name null')
        from metadrive.envs.metadrive_env import MetaDriveEnv
        from metadrive.obs.image_obs import ImageObservation
        from openpilot.tools.sim.bridge.metadrive.metadrive_common import RGBCameraRoad, configure_software_rendering
        configure_software_rendering()
        ImageObservation.observe = lambda self, *args, **kwargs: self.state
        env = MetaDriveEnv({'image_observation': True, 'image_on_cuda': False, 'traffic_density': 0,
                           'vehicle_config': {'image_source': 'rgb_road', 'render_vehicle': False},
                           'sensors': {'rgb_road': (RGBCameraRoad, 1928, 1208)}, 'decision_repeat': 1, 'physics_world_step_size': .05,
                           'preload_models': False, 'show_logo': False, 'map': 'S'})
        try:
          env.reset()
          camera = env.engine.sensors['rgb_road']
          camera.get_cam().reparentTo(env.vehicle.origin)
          camera.get_cam().setPos(0, 0, 1.22)
          def measure(check_image=True):
            timings = []
            for _ in range(12):
              start = time.perf_counter()
              env.step([0, 0])
              frame = camera.perceive(to_float=False)
              timings.append((time.perf_counter() - start) * 1000)
            assert frame.shape == (1208, 1928, 3)
            if check_image:
              assert frame.max() > frame.min()
            return statistics.median(timings[2:]), min(timings[2:]), max(timings[2:])
          baseline = measure()
          engine = env.engine.graphicsEngine
          for i in range(engine.getNumWindows()):
            output = engine.getWindow(i)
            print('Graphics output:', output.getName(), output.getXSize(), output.getYSize(), output.isActive())
          for output in env.engine.pbrpipe.manager.buffers:
            output.setActive(False)
          main_disabled = measure()
          env.engine.pssm.buffer.setActive(False)
          shadow_buffer_disabled = measure()
          env.engine.render.setShaderInput('use_pssm', False)
          shadow_shader_disabled = measure()
          env.engine.terrain._mesh_terrain.hide()
          terrain_hidden = measure(check_image=False)
          print('Render milliseconds (median, min, max):', 'baseline=', baseline, 'main filters disabled=', main_disabled,
                'shadow buffer disabled=', shadow_buffer_disabled, 'shadow shader disabled=', shadow_shader_disabled, 'terrain hidden=', terrain_hidden)
          assert baseline[0] < 50, 'Rendering alone exceeds the 20 Hz frame budget'
        finally:
          env.close()
        PY
    - name: Build
      run: scons -j4
    - name: Camera and policy history regressions
      run: python -m unittest openpilot.tools.sim.tests.test_camerad openpilot.tools.sim.tests.test_policy_inputs -v
    - name: Drive for 60 seconds
      timeout-minutes: 7
      env:
        SIM_ARTIFACTS_DIR: ${{ github.workspace }}/sim-artifacts/run-1
      run: python -m unittest openpilot.tools.sim.tests.test_metadrive_bridge -v
    - name: Required driving artifacts
      run: |
        python - <<'PY'
        from pathlib import Path
        for name in ('rlog.zst', 'qlog.zst', 'qcamera.ts'):
          assert any(p.stat().st_size for p in Path('sim-artifacts').rglob(name)), f'Missing nonempty {name}'
        PY
    - name: Check compact artifact size
      id: artifact_size
      if: always()
      run: |
        python - <<'PY'
        from pathlib import Path
        size = sum(p.stat().st_size for p in Path('sim-artifacts').rglob('*') if p.is_file())
        assert size <= 15 * 1024**2, f'Proof artifact exceeds 15 MiB: {size}'
        PY
    - uses: actions/upload-artifact@v7
      if: always() && steps.artifact_size.outcome != 'failure'
      with:
        name: simulator-logs
        path: sim-artifacts
        retention-days: 1
        if-no-files-found: warn
